name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y libjansson-dev jq bats
      - name: Build C binary
        run: |
          mkdir -p tables.c/dist
          gcc tables.c/tables.c/tables_main.c tables.c/tables.c/tables_config.c tables.c/tables.c/tables_data.c tables.c/tables.c/tables_datatypes.c tables.c/tables.c/tables_render.c tables.c/tables.c/tables_render_title.c tables.c/tables.c/tables_render_footer.c tables.c/tables.c/tables_render_rows.c tables.c/tables.c/tables_render_summaries.c tables.c/tables.c/tables_render_output.c tables.c/tables.c/tables_render_utils.c -ljansson -o tables.c/tables -lm
      - name: Upload C binary
        uses: actions/upload-artifact@v4
        with:
          name: tables-binary
          path: tables.c/tables

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y jq bats
      - name: Download C binary
        uses: actions/download-artifact@v4
        with:
          name: tables-binary
          path: tables.c/
      - name: Run comparison tests
        run: |
          chmod +x tests/run_tests.sh
          bash tests/run_tests.sh

  cloc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Count Lines of Code (cloc)
        uses: djdefi/cloc-action@main
        with:
          options: --force-lang=Pascal,inc -force-lang=YAML,yml --report-file=cloc.txt --ignored=cloc-ignored.txt
      - run: csplit README.md /\<\!--CLOC/ {1}
      - run: cp xx00 README.md
      - run: echo "<!--CLOC-START -->" >> README.md
      - run: echo "\`\`\`cloc" >> README.md
      - run: echo "NOW=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
      - run: echo "Last updated at ${{ env.NOW }}" >> README.md
      - run: tail -n +2 cloc.txt >> README.md
      - run: echo "SKIP=$(wc -l < cloc-ignored.txt)" >> $GITHUB_ENV
      - run: echo "${{ env.SKIP }} Files were skipped (duplicate, binary, or without source code):" >> README.md
      - run: |
          awk '{sub(/:.*/,""); ext=tolower($1); ext=substr(ext, match(ext, /[^\/]*$/)); ext=substr(ext, match(ext, /\.[^.]*$/)+1); counts[ext]++} END {for(i in counts) {printf("  %s: %d\n",i,counts[i])}}' cloc-ignored.txt | sort -t: -k2nr -k1 >> README.md
      - run: echo "\`\`\`" >> README.md
      - run: cat xx02 >> README.md
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          skip_dirty_check: true
          branch: main
          file_pattern: 'README.md'
